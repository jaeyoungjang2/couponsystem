services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coupon
      MYSQL_USER: coupon
      MYSQL_PASSWORD: coupon
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.0
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    # Kafka 3.8 부터 KRaft 모드가 기본이라 ZooKeeper 없음.
    image: apache/kafka:3.8.0
    environment:
      # 단일 노드로 진행, 운영에서는 3개 5개로 사용
      KAFKA_NODE_ID: 1
      # KRaft 모드 역할 중 하나가 어디로 라우팅 할 것인가에 대한 결정을 하는 역할을 하는 controller 같이 사용
      KAFKA_PROCESS_ROLES: broker,controller
      # 중요한건 9094 포트: 외부에서 9094로 연결, application도 9094로 연결
      # 9092는 kafka container 실행되는 것 안에서는 9092 연결
      # controller는 kraft 내부 통신용
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      # 외부 요청들이 나한테 어디로 붙으면 될지 알려주는 설정
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 중요: kraft 모드에서 quorum 구성 즉 node가 한개가 아니라 여러개일 때, 리더가 죽었을 때 새로운 노드를 어떻게 산출할 것인가에 대한 것
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 보안 프로토콜: 개발이기 떄문에 plaintext로 설정
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      # borker 간 통신 방식 지정
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # topic 안에 partition을 3개로 설정
      KAFKA_NUM_PARTITIONS: 3
      # 중요: 복제 갯수, kafka의 내구성을 지키기 위해서 여러 노드에서 토필을 복제하는건데, 분산된 서버에 데이터를 복제하기 위한 설정, 현재는 노드가 하나기 때문에 복제 없는걸로 설정
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # 카프카 트랜잭션 설정
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # 카프카 트랜잭션 설정
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 토픽 자동 생성: application에서 토픽 관련 코드를 작성하면 토픽이 자동으로 생성되도록 함
      # 운영에서는 이렇게 사용하지 않음
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 20
  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

